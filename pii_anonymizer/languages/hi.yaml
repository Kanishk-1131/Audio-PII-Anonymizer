names:
  # strong cues: the next word(s) are taken as a name
  cues:
    - मेरा नाम
    - मेरा नाम है
    - मेरा पूरा नाम
    - हमारा नाम
    - मेरा शुभ नाम
    - mera naam
    - mera naam hai
    - hamara naam
    - मायसेल्फ
    - माई नेम इज
  # weak cues: accepted if the word is a known name OR a terminator follows
  weak_cues:
    - नाम
    - naam
    - नाम है
  # gazetteer cues: accepted only if the following word is a known name
  gazetteer_cues:
    - मैं
    - main
  frames:
    - [मैं, बोल]
    - [main, bol]
    - [मैं, बात]
  weak_frames:
    - [मैं, हूं]
    - [main, hoon]
  skip_after_cue: [है, हैं, तो, जी, hai, to, ji]
  terminators: [है, हैं, हूं, जी, hai, hoon, hun, ji, बोल, bol]
  honorifics_after: [जी, सर, साहब, साब, मैडम, मेम, मैम, बाबू, भैया, दीदी, sahab, saab, bhaiya, didi]
  honorifics_before: [श्री, श्रीमती, सुश्री, कुमारी, मिस्टर, मिसेज, मिस, डॉक्टर, डॉ, shri, shrimati]
  # suffixes the ASR may glue to a name ("प्रियाजी"); stripped before a name is remembered
  name_suffixes: [जी, ji]
  stopwords: [
    है, हैं, हूं, हो, था, थी, थे, जी, हां, नहीं, ना, क्या, कौन, कहां, कब, कैसे, क्यों,
