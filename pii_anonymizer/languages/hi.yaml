# Hindi language pack.
# All entries are passed through textnorm.normalize() at load time, so
# nukta / chandrabindu / case variants do not need to be listed twice.
# NOTE: YAML silently keeps only the LAST value of a duplicated key - the
# loader therefore re-checks for collisions between different values.
code: hi
name: Hindi
whisper_language: hi
include: [en]

